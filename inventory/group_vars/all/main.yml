---
timezone: Europe/London

admin_user: oreo
admin_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINGg9jvaW7UlW4sGMAoEDQsmpNryP0GzfgkmD1S8kTvV oreo@oreos-laptop

ssh_password_authentication: false
ssh_permit_root_login: false

common_packages:
  - ca-certificates
  - curl
  - git
  - python3
  - sudo
  - ufw

manage_ufw: true
ufw_default_incoming_policy: deny
ufw_default_outgoing_policy: allow
ufw_default_routed_policy: deny

# Set this to false after importing the laptop WireGuard profile. Ansible will
# then remove temporary SSH rules while retaining VPN management access.
bootstrap_mode: false
ufw_bootstrap_rules:
  - port: "22"
    proto: tcp
    from_ip: 192.168.0.0/16
    comment: Bootstrap SSH from LAN

# The VPS already has an unmanaged wg0 for legacy/proxy services. Keep it
# intact and run the Ansible-managed management VPN separately.
wireguard_interface: wg1
wireguard_port: 51821
wireguard_vpn_network: 10.44.0.0/24
