---
all:
  children:
    vps:
      hosts:
        proxy-vps:

    applications:
      hosts:
        application-vm:

    # Off-site application guests are deliberately separate from the primary
    # applications group so they do not receive the primary VM's platform
    # roles by accident.
    offsite_applications:
      hosts:
        immich2:

    # Temporary per-host bootstrap state. Remove a host from this group after
    # its management VPN is working; do not use a global -e override.
    bootstrap:
      hosts:

    proxmox:
      hosts:
        proxmox-host:
        proxmox-backup-host:

    # WireGuard is installed on every host in these child groups.
    vpn:
      children:
        vps:
        applications:
        proxmox:
        offsite_applications:
