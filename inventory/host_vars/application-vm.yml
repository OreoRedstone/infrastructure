---
# Use the LAN address while bootstrapping, then manage this host over WireGuard.
ansible_host_bootstrap: 192.168.0.100
ansible_host: "{{ ansible_host_bootstrap if (bootstrap_mode | bool) else (wireguard_address.split('/')[0]) }}"
ansible_user: oreo
ansible_become: true
ansible_become_password: "{{ vault_applications_sudo_password }}"

hostname: oreo-applications

wireguard_address: 10.44.0.2/24

# Prometheus runs in Docker on this host and reaches the host exporter via the
# Docker bridge rather than via WireGuard.
node_exporter_firewall_sources:
  - "{{ wireguard_vpn_network }}"
  - 172.16.0.0/12
wireguard_peers:
  - name: VPS hub
    host: proxy-vps
    endpoint: "{{ hostvars['proxy-vps']['wireguard_endpoint'] }}:{{ wireguard_port }}"
    allowed_ips:
      - "{{ wireguard_vpn_network }}"
    persistent_keepalive: "{{ wireguard_persistent_keepalive }}"

docker_users:
  - "{{ admin_user }}"

komodo_bind_address: 0.0.0.0
komodo_wait_host: 127.0.0.1
komodo_host_url: https://deploy.74services.net
komodo_image_tag: "2"
komodo_periphery_ssl_enabled: false
komodo_periphery_server_enabled: true
komodo_publish_core_port: true
komodo_join_nginx_network: false
komodo_first_server_name: oreo-applications
komodo_admin_username: oreo
komodo_disable_user_registration: true
# Preserve non-secret settings from the current .env here (preferably via
# encrypted vault data). Secret values should use the dedicated vault fields.
komodo_extra_env: "{{ vault_komodo_extra_env | default({}) }}"
komodo_ntfy_enabled: true
komodo_ntfy_env_content: "{{ vault_komodo_ntfy_env }}"

# The VPS forwards public TCP/443 to this VM. Nginx terminates TLS here,
# routes deploy.74services.net to Komodo, and sends all other hostnames to Traefik.
nginx_reverse_proxy_deploy_server_name: deploy.74services.net
nginx_reverse_proxy_deploy_upstream: 127.0.0.1:9120
nginx_reverse_proxy_default_upstream: 127.0.0.1:9999
# Replace these with the certificate paths present on this VM.
nginx_reverse_proxy_tls_certificate: /etc/letsencrypt/live/74services.net/fullchain.pem
nginx_reverse_proxy_tls_certificate_key: /etc/letsencrypt/live/74services.net/privkey.pem
