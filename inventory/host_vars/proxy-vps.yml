---
ansible_host_bootstrap: 217.154.34.64
ansible_host: "{{ ansible_host_bootstrap if (bootstrap_mode | bool) else (wireguard_address.split('/')[0]) }}"
ansible_user: oreo
ansible_become: true
ansible_become_password: "{{ vault_vps_sudo_password }}"

hostname: proxy-vps

wireguard_address: 10.44.0.1/24
wireguard_endpoint: 217.154.34.64
wireguard_is_hub: true
wireguard_enable_peer_forwarding: true
wireguard_peers:
  - name: Applications
    host: application-vm
    allowed_ips:
      - 10.44.0.2/32
  - name: Proxmox
    host: proxmox-host
    allowed_ips:
      - 10.44.0.3/32
  - name: Backup Proxmox
    host: proxmox-backup-host
    allowed_ips:
      - 10.44.0.5/32

# During migration, copy the old networking VM's public key and WireGuard
# address here so Ansible can stage Applications without dropping that peer.
# Remove this list before the final cutover.
wireguard_transition_peers: []

# Add vault_wireguard_laptop_public_key to inventory/group_vars/all/vault.yml.
# Until then, this peer is deliberately omitted from the VPS configuration.
wireguard_external_peers:
  - name: Laptop
    public_key: "{{ vault_wireguard_laptop_public_key | default('') }}"
    allowed_ips:
      - 10.44.0.4/32

# Public SSH remains key-only during initial provisioning. Setting
# bootstrap_mode to false removes this rule.
ufw_bootstrap_rules:
  - port: "22"
    proto: tcp
    from_ip: 0.0.0.0/0
    comment: Bootstrap SSH from Internet

nginx_stream_proxies:
  - name: minecraft
    protocol: tcp
    listen_port: 25565
    upstream_host: 10.44.0.2
    upstream_port: 25565

  - name: space-engineers
    protocol: udp
    listen_port: 27016
    upstream_host: 10.44.0.2
    upstream_port: 27016

  - name: factorio
    protocol: udp
    listen_port: 34197
    upstream_host: 10.44.0.2
    upstream_port: 34197
    reuseport: true

# TLS terminates on the VPS. Certificates are expected at these paths and are
# intentionally provisioned manually until ACME automation is added.
nginx_reverse_proxy_public: true
nginx_reverse_proxy_tls_certificate: /etc/letsencrypt/live/74services.net/fullchain.pem
nginx_reverse_proxy_tls_certificate_key: /etc/letsencrypt/live/74services.net/privkey.pem
nginx_reverse_proxy_default_upstream: 10.44.0.2:9999
nginx_reverse_proxy_routes:
  - name: komodo
    server_names:
      - deploy.74services.net
    upstream: 10.44.0.2:9120

  - name: immich
    server_names:
      - photos-2.74services.net
    # Immich's standard Compose deployment exposes HTTP/2283. Replace .6
    # with the final WireGuard address allocated to the Immich guest.
    upstream: 10.44.0.6:2283
