---
ansible_host: 217.154.34.64
ansible_user: root

hostname: proxy-vps

wireguard_address: 10.13.13.1/24
wireguard_endpoint: 217.154.34.64
wireguard_is_hub: true
wireguard_enable_peer_forwarding: true
wireguard_peers:
  - name: Applications
    host: application-vm
    allowed_ips:
      - 10.13.13.2/32
  - name: Proxmox
    host: proxmox-host
    allowed_ips:
      - 10.13.13.3/32

# Add vault_wireguard_laptop_public_key to inventory/group_vars/all/vault.yml.
# Until then, this peer is deliberately omitted from the VPS configuration.
wireguard_external_peers:
  - name: Laptop
    public_key: "{{ vault_wireguard_laptop_public_key | default('') }}"
    allowed_ips:
      - 10.13.13.4/32

# Public SSH remains key-only during initial provisioning. Setting
# bootstrap_mode to false removes this rule.
ufw_bootstrap_rules:
  - port: "22"
    proto: tcp
    from_ip: 0.0.0.0/0
    comment: Bootstrap SSH from Internet

nginx_stream_proxies:
  - name: https
    protocol: tcp
    listen_port: 443
    upstream_host: 10.13.13.2
    upstream_port: 443

  - name: minecraft
    protocol: tcp
    listen_port: 25565
    upstream_host: 10.13.13.2
    upstream_port: 25565

  - name: space-engineers
    protocol: udp
    listen_port: 27016
    upstream_host: 10.13.13.2
    upstream_port: 27016

  - name: factorio
    protocol: udp
    listen_port: 34197
    upstream_host: 10.13.13.2
    upstream_port: 34197
    reuseport: true
