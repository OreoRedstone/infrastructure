[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

# Make output readable.
stdout_callback = default
result_format = yaml

# Do not create retry files in the repository.
retry_files_enabled = false

# Ansible should verify the VPS host key.
host_key_checking = true

# Python interpreter discovery usually works correctly on Ubuntu.
interpreter_python = auto_silent

# Make accidental hangs fail with a useful error.
timeout = 30

[ssh_connection]
pipelining = true
