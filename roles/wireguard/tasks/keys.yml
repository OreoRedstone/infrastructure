---
- name: Validate WireGuard host variables
  ansible.builtin.assert:
    that:
      - wireguard_address | length > 0
      - wireguard_peers | length > 0
    fail_msg: "Set wireguard_address and wireguard_peers for {{ inventory_hostname }}."

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check for an existing WireGuard private key
  ansible.builtin.stat:
    path: "{{ wireguard_private_key_path }}"
  register: wireguard_private_key_file

- name: Generate a WireGuard private key
  ansible.builtin.command: wg genkey
  register: wireguard_generated_private_key
  changed_when: true
  no_log: true
  when: not wireguard_private_key_file.stat.exists

- name: Store the WireGuard private key on its host
  ansible.builtin.copy:
    dest: "{{ wireguard_private_key_path }}"
    content: "{{ wireguard_generated_private_key.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not wireguard_private_key_file.stat.exists

- name: Read the WireGuard private key
  ansible.builtin.slurp:
    src: "{{ wireguard_private_key_path }}"
  register: wireguard_private_key_slurp
  no_log: true

- name: Derive the WireGuard public key
  ansible.builtin.command:
    argv:
      - wg
      - pubkey
    stdin: "{{ wireguard_private_key_slurp.content | b64decode | trim }}"
    stdin_add_newline: true
  register: wireguard_derived_public_key
  changed_when: false
  no_log: true

- name: Publish the host's WireGuard public key for peer rendering
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wireguard_derived_public_key.stdout | trim }}"
    wireguard_private_key: "{{ wireguard_private_key_slurp.content | b64decode | trim }}"
  no_log: true

- name: Store the non-secret public key on its host
  ansible.builtin.copy:
    dest: "{{ wireguard_public_key_path }}"
    content: "{{ wireguard_public_key }}\n"
    owner: root
    group: root
    mode: "0644"

