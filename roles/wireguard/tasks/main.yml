---
- name: Validate WireGuard host variables
  ansible.builtin.assert:
    that:
      - wireguard_address | length > 0
      - wireguard_peers | length > 0
    fail_msg: "Set wireguard_address and wireguard_peers for {{ inventory_hostname }}."

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check for an existing WireGuard private key
  ansible.builtin.stat:
    path: "{{ wireguard_private_key_path }}"
  register: wireguard_private_key_file

- name: Generate a WireGuard private key
  ansible.builtin.command: wg genkey
  register: wireguard_generated_private_key
  changed_when: true
  no_log: true
  when: not wireguard_private_key_file.stat.exists

- name: Store the WireGuard private key on its host
  ansible.builtin.copy:
    dest: "{{ wireguard_private_key_path }}"
    content: "{{ wireguard_generated_private_key.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not wireguard_private_key_file.stat.exists

- name: Read the WireGuard private key
  ansible.builtin.slurp:
    src: "{{ wireguard_private_key_path }}"
  register: wireguard_private_key_slurp
  no_log: true

- name: Derive the WireGuard public key
  ansible.builtin.command:
    argv:
      - wg
      - pubkey
    stdin: "{{ wireguard_private_key_slurp.content | b64decode | trim }}"
    stdin_add_newline: true
  register: wireguard_derived_public_key
  changed_when: false
  no_log: true

- name: Publish the host's WireGuard public key for peer rendering
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wireguard_derived_public_key.stdout | trim }}"
    wireguard_private_key: "{{ wireguard_private_key_slurp.content | b64decode | trim }}"
  no_log: true

- name: Store the non-secret public key on its host
  ansible.builtin.copy:
    dest: "{{ wireguard_public_key_path }}"
    content: "{{ wireguard_public_key }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Validate supplied external peer public keys
  ansible.builtin.assert:
    that:
      - item.public_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      {{ item.name }} has an invalid WireGuard public key. Replace the example
      vault value with the 44-character public key generated on that peer.
  loop: "{{ wireguard_external_peers }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.public_key | default('') | length > 0

- name: Verify public keys were collected from every managed peer
  ansible.builtin.assert:
    that:
      - hostvars[item.host].wireguard_public_key is defined
    fail_msg: >-
      No public key fact is available for {{ item.host }}. Run the VPN play for
      the complete vpn group rather than limiting it to one host.
  loop: "{{ wireguard_peers }}"
  loop_control:
    label: "{{ item.name }}"
  when: wireguard_configure | bool

- name: Validate temporary migration peer keys
  ansible.builtin.assert:
    that:
      - item.public_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      {{ item.name }} has an invalid transition peer key. Copy the current
      peer's public key from the existing VPS WireGuard configuration.
  loop: "{{ wireguard_transition_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure WireGuard
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard
  when: wireguard_configure | bool

- name: Enable IPv4 forwarding on the VPN hub
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when: wireguard_configure | bool and wireguard_enable_peer_forwarding | bool

- name: Enable and start WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
  when: wireguard_configure | bool

- name: Apply WireGuard configuration changes now
  ansible.builtin.meta: flush_handlers
  when: wireguard_configure | bool

- name: Explain an omitted laptop peer
  ansible.builtin.debug:
    msg: >-
      The Laptop peer is not active yet. Add vault_wireguard_laptop_public_key
      and rerun the playbook after generating the laptop key pair.
  when:
    - wireguard_is_hub | bool
    - wireguard_external_peers | selectattr('public_key', 'equalto', '') | list | length > 0
    - wireguard_configure | bool
