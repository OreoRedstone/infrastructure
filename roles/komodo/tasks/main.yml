---
- name: Verify required Komodo secrets are present
  ansible.builtin.assert:
    that:
      - "'REPLACE_' not in vault_komodo_database_password"
      - "'REPLACE_' not in vault_komodo_admin_password"
      - "'REPLACE_' not in vault_komodo_webhook_secret"
      - "'REPLACE_' not in vault_komodo_jwt_secret"
      - >-
        komodo_deploy_core | bool or
        (komodo_periphery_core_address | length > 0 and
        vault_komodo_periphery_onboarding_key | length > 0 and
        'REPLACE_' not in vault_komodo_periphery_onboarding_key)
      - (not komodo_ntfy_enabled | bool) or (komodo_ntfy_env_content | length > 0)
      - (not komodo_ntfy_enabled | bool) or ('REPLACE_' not in komodo_ntfy_env_content)
      - (not komodo_ntfy_enabled | bool) or ('NTFY_URL=' in komodo_ntfy_env_content)
      - (not komodo_ntfy_enabled | bool) or ('NTFY_TOPIC=' in komodo_ntfy_env_content)
      - (not komodo_ntfy_enabled | bool) or ('NTFY_TOKEN=' in komodo_ntfy_env_content)
    fail_msg: >-
      Create inventory/group_vars/all/vault.yml with the Komodo secrets and
      Ntfy wrapper environment shown in examples/vault.yml, encrypt it with
      ansible-vault, and rerun.
  no_log: true

- name: Create Komodo directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ komodo_project_directory }}"
      mode: "0750"
    - path: "{{ komodo_root_directory }}"
      mode: "0750"
    - path: "{{ komodo_backups_directory }}"
      mode: "0750"

- name: Install the Komodo environment file
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ komodo_project_directory }}/compose.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: komodo_environment

- name: Install the Komodo Ntfy wrapper environment file
  ansible.builtin.copy:
    dest: "{{ komodo_project_directory }}/ntfy.env"
    content: "{{ komodo_ntfy_env_content }}"
    owner: root
    group: root
    mode: "0600"
  when: komodo_ntfy_enabled | bool
  no_log: true

- name: Install the Komodo Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ komodo_project_directory }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: komodo_compose_file

- name: Deploy Komodo services
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_project_directory }}"
    project_name: komodo
    files:
      - compose.yaml
    state: present
    pull: always
    remove_orphans: true
    recreate: >-
      {{ (komodo_environment is changed or komodo_compose_file is changed)
         | ternary('always', 'auto') }}

- name: Wait for Komodo Core to listen on the VPN
  ansible.builtin.wait_for:
    host: "{{ komodo_wait_host }}"
    port: 9120
    timeout: 120
  when: komodo_publish_core_port | bool
