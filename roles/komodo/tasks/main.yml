---
- name: Verify required Komodo secrets are present
  ansible.builtin.assert:
    that:
      - "'REPLACE_' not in vault_komodo_database_password"
      - "'REPLACE_' not in vault_komodo_admin_password"
      - "'REPLACE_' not in vault_komodo_webhook_secret"
      - "'REPLACE_' not in vault_komodo_jwt_secret"
      - (not komodo_ntfy_enabled | bool) or (komodo_ntfy_env_content | length > 0)
      - (not komodo_ntfy_enabled | bool) or ('REPLACE_' not in komodo_ntfy_env_content)
    fail_msg: >-
      Create inventory/group_vars/all/vault.yml with the four Komodo secrets
      shown in examples/vault.yml, encrypt it with ansible-vault, and rerun.
  no_log: true

- name: Create Komodo directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ komodo_project_directory }}"
      mode: "0750"
    - path: "{{ komodo_project_directory }}/secrets"
      mode: "0700"
    - path: "{{ komodo_root_directory }}"
      mode: "0750"
    - path: "{{ komodo_backups_directory }}"
      mode: "0750"

- name: Install Komodo secret files
  ansible.builtin.copy:
    dest: "{{ komodo_project_directory }}/secrets/{{ item.name }}"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: database_password
      value: "{{ vault_komodo_database_password }}"
    - name: admin_password
      value: "{{ vault_komodo_admin_password }}"
    - name: webhook_secret
      value: "{{ vault_komodo_webhook_secret }}"
    - name: jwt_secret
      value: "{{ vault_komodo_jwt_secret }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  register: komodo_secret_files

- name: Install the Komodo environment file
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ komodo_project_directory }}/compose.env"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  register: komodo_environment

- name: Install the Komodo Ntfy wrapper environment file
  ansible.builtin.copy:
    dest: "{{ komodo_project_directory }}/ntfy.env"
    content: "{{ komodo_ntfy_env_content }}"
    owner: root
    group: root
    mode: "0600"
  when: komodo_ntfy_enabled | bool
  no_log: true

- name: Install the Komodo Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ komodo_project_directory }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: komodo_compose_file

- name: Deploy Komodo Core, Periphery, and MongoDB
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_project_directory }}"
    project_name: komodo
    files:
      - compose.yaml
    state: present
    pull: missing
    remove_orphans: true
    recreate: >-
      {{ (komodo_secret_files is changed or komodo_environment is changed or
          komodo_compose_file is changed) | ternary('always', 'auto') }}

- name: Wait for Komodo Core to listen on the VPN
  ansible.builtin.wait_for:
    host: "{{ komodo_bind_address }}"
    port: 9120
    timeout: 120
  when: komodo_publish_core_port | bool
